name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup node
      uses: actions/setup-node@v7
      with:
        node-version: lts/*

    - name: Install
      run: npm ci

    - name: Lint
      run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup node
      uses: actions/setup-node@v7
      with:
        node-version: lts/*

    - name: Install
      run: npm ci

    - name: Test
      run: npm test

    - name: Coverage
      run: npm run coverage

    - name: Coveralls
      uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        flag-name: run-${{ matrix.test_number }}
